<svg xmlns="http://www.w3.org/2000/svg"
     width="700"
     height="220"
     viewBox="0 0 700 220">

  <defs>
    <linearGradient id="gscBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#1A73E8"/>
